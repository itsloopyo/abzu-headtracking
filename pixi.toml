[workspace]
name = "abzu-head-tracking"
version = "0.0.0"
description = "Head tracking mod for ABZU using CameraUnlock shared library"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
cmake = ">=3.28"

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = { cmd = "git submodule update --remote cameraunlock-core" }
# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = "powershell -Command \"if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists' -ForegroundColor Yellow }\"" }
build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }
build-debug = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }
clean = { cmd = "powershell -Command \"if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }\"" }
clean-all = { cmd = "powershell -Command \"if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; if (Test-Path 'release') { Remove-Item 'release' -Recurse -Force }\"" }
update-deps = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build", "test"] }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
# The behaviour tests and the config differential test against the published build. The
# provenance check first: the differential test proves nothing once a file it compiles has
# drifted from the build it names.
test = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-differential-provenance.ps1 && ctest --test-dir build -C Release --output-on-failure", depends-on = ["build"] }
# Rewrites the committed HeadTracking.ini, the table's fresh render (the bytes the mod creates
# as CameraUnlock.ini at first launch), and the launcher manifest's config descriptor.
render-config = { cmd = "build/Release/abzuht_canonical_config_tests.exe --render-config HeadTracking.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build"] }
# Checks the newest release/*-installer.zip against the launcher manifest contract, and the
# Nexus ZIP for a config it must not carry.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
uninstall = { cmd = "cmd /c scripts\\uninstall.cmd /y" }
release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }
